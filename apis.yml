name: YourPay
description: YourPay is an Indonesian fintech mobile application that helps overseas workers and their
  families send money to Indonesia, pay bills (electricity, BPJS), buy phone credit, top up e-wallets,
  make QRIS payments, and shop online. It is registered with Bank Indonesia as a Payment Service Provider
  (Kategori Izin 1, license 23/678/DKSP/Srt/B) and monitored by KOMINFO. YourPay is a consumer-facing
  payments app and does not currently publish a public developer portal, API reference, or OpenAPI
  definition. It was surfaced as a 500 Global portfolio company and added to the API Evangelist network.
